  /api/v1/conversation-items/{itemId}/voice-transcript:
    get:
      tags:
      - Conversations
      summary: Get Voice Transcript
      description: 'Returns a transcript of a phone call or a voicemail

        '
      operationId: getVoiceTranscript
      parameters:
      - in: path
        name: itemId
        description: 'id of the conversation item

          '
        schema:
          type: string
