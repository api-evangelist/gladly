  /api/v1/conversation-items/{itemId}/attachments/{attachmentId}:
    get:
      tags:
      - Conversations
      summary: Get Attachment
      description: 'Returns a redirect to the URL of the specified attachment on a conversation item.


        The response is a `303 See Other` redirect. Follow the redirect to download the attachment content.


        Attachments are available on conversation items with content types that support them, such as emails, chat messages, SMS messages, and custom channel messages.

        '
      operationId: getAttachment
      parameters:
      - in: path
        name: itemId
        schema:
          type: string
          example: pOVVdzweSumI4bFxjlT8LA
        required: true
        description: 'Id of the conversation item that contains the attachment.

          '
      - in: path
        name: attachmentId
        schema:
          type: string
          example: dGhpcyBpcyBhbiBhdHRhY2htZW50
        required: true
        description: 'Id of the attachment to retrieve.

          '
      responses:
        '303':
          description: Redirect to the attachment URL
          headers:
            Location:
              schema:
                type: string
              description: 'URL to download the attachment content.

                '
        '400':
          description: The conversation item content does not contain attachments
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
              example:
                errors:
                - code: invalid
                  detail: conversation item content does not contain attachments
        '404':
          description: The conversation item or attachment could not be found
  /api/v1/customers/{customerId}/conversation-items:
    post:
      tags:
      - Conversations
      summary: Create Item for Customer
      description: 'To add items to a customer''s timeline.


        Any items created using this API will not be considered part of a conversation, and are **non-routable** and **non-searchable** aside from the mobile phone number or email address specified as part of the payload.

        '
      operationId: createCustomerItem
      parameters:
      - in: path
        name: customerId
        schema:
          type: string
        required: true
        description: 'Id of the customer associated with this item.


          You can look up the id using the [Find customers](index.html#tag/Customers) API.

          '
      requestBody:
        description: Conversation Item to create
        content:
          application/json:
            schema:
              title: Conversation Item To Create
              required:
              - content
              type: object
              properties:
                id:
                  maxLength: 50
                  type: string
                  description: Unique conversation item id. Must be URL safe and under 50 characters. An id will be automatically generated if one is not included.
                  example: pOVVdzweSumI4bFxjlT8LA
                content:
                  $ref: '#/paths/~1api~1v1~1conversation-items/post/requestBody/content/application~1json/schema/properties/content'
            examples:
              Customer Activity:
                summary: Example of a Customer Activity
                value:
                  content:
                    type: CUSTOMER_ACTIVITY
                    title: Welcome to Gladly!
                    body: At Gladly we set out to reinvent customer service. Why? Because 21st century consumers are different. They are from 18 to 80 years old, expect the brands they love to recognize them, and to be able to communicate with your agents over all channels – all the time.
                    activityType: EMAIL
                    sourceName: HubSpot
                    link:
                      url: https://www.gladly.com/product/
                      text: View Details
      responses:
        '200':
          description: The created item
          content:
            application/json:
              schema:
                $ref: '#/paths/~1api~1v1~1conversation-items/post/responses/200/content/application~1json/schema'
        '301':
          description: This customer id no longer exists, but has been moved because it has been merged with another customer
          headers:
            Location:
              schema:
                type: string
                example: https://example.gladly.com/api/v1/customers/TX6f82W4S_ayp11kP4dhrQ/conversation-items
              description: Location of the new customer id to use
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
              example:
                errors:
                - attr: customer id
                  code: moved
                  detail: the customer id has changed from [wjotRA-fSU6feGCxdFwwNQ] to [TX6f82W4S_ayp11kP4dhrQ]
                  meta:
