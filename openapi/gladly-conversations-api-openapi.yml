  /api/v1/conversations/{conversationId}/items:
    get:
      tags:
      - Conversations
      summary: List Items in Conversation
      description: 'Get the list of items in the timeline of a conversation.

        The conversation represents a period of related interactions between a customer and your organization.

        The list is not paginated and will return at most 1000 items. The items are returned in ascending order by timestamp.

        The `Gladly-Limited-Data` header flag in the response will indicate if the conversation has more items than returned.


        The response can be filtered by session using the optional `sessionId` query parameter.

        '
      operationId: getConversationItems
      parameters:
      - in: path
        name: conversationId
        schema:
          type: string
        required: true
        description: Id of the conversation to get the timeline for
        example: 9BcE2O0DQ2ynGHRmk9FeoA
      - in: query
        name: sessionId
        schema:
          type: string
        required: false
        description: Return only items whose `sessionId` matches the given value.
        example: 5k04bYuTRGqyT6uoSQfWVA
      responses:
        '200':
          description: The items on the conversation timeline
          content:
            application/json:
              schema:
                title: Conversation Items
                type: array
                items:
                  $ref: '#/paths/~1api~1v1~1conversation-items~1%7BitemId%7D/get/responses/200/content/application~1json/schema'
