openapi: 3.2.0
info:
  title: Gladly Freeform Topics API
  version: '1.0'
  description: '# Introducing the Gladly API


    At Gladly, we believe that customer service is best when it''s a conversation.'
servers:
- url: https://{organization}.gladly.com/api/v1
  description: Production
  variables:
    organization:
      default: organization
      description: Your Gladly organization subdomain
- url: https://{organization}.gladly.qa/api/v1
  description: Sandbox
  variables:
    organization:
      default: organization
      description: Your Gladly QA organization subdomain
security:
- basicAuth: []
tags:
- name: Freeform Topics
  description: Freeform Topics allow you to associate granular data like Order Number to a Conversation.
paths:
  /api/v1/custom-attributes/:customAttributeId:
    get:
      tags:
      - Freeform Topics
      summary: Get Custom Attribute
      description: Returns a custom attribute that matches the provided custom attribute id.
      operationId: getCustomAttribute
      parameters:
      - name: customAttributeId
        in: path
        description: 'id of the custom attribute

          '
        required: true
        schema:
          type: string
          example: 1grfSzATQLa334VDLCWc4A
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    description: id of the Custom Attribute
                    example: 1grfSzATQLa334VDLCWc4A
                  key:
                    type: string
                    description: key of the Custom Attribute
                    example: orderId
                  label:
                    type: string
                    description: label of the Custom Attribute
                    example: Order ID
                  deactivated:
                    type: boolean
                    description: whether the Custom Attribute is deactivated
                    example: true
                  createdAt:
                    type: string
                    format: RFC3339
                    description: time the Custom Attribute was created
                    example: '2020-05-20T15:00:00.000Z'
                  createdBy:
                    type: string
                    description: id of user who created the Custom Attribute
                    example: 7MRwXOeWRaGatwYCbBLLA
        '404':
          description: Custom Attribute not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
              example:
                errors:
                  code: not_exist
                  detail: custom attribute 1grfSzATQLa334VDLCWc4A does not exist
components:
  schemas:
    Error:
      type: object
      properties:
        attr:
          type: string
          description: Identifies the field causing the error
        code:
          type: string
          description: Code indicating the error type
        detail:
          type: string
          description: More details describing what went wrong
    Errors:
      type: object
      properties:
        errors:
          type: array
          items:
            $ref: '#/components/schemas/Error'
          example:
          - attr: content
            code: blank
            detail: content cannot be blank
  securitySchemes:
    BasicAuth:
      type: http
      scheme: basic
      description: 'Gladly API uses token-based **Basic Authentication**. API tokens are associated with designated Gladly users.

        To create and use an API token, your user must have the API User permission. An API token can be used to perform any API request without restriction.


        | user name   | password  |

        | ----------- | --------- |

        | agent email | API token |


        The credentials must be passed via an `Authorization` HTTP header. All requests must be made over HTTPS.


        ```shell

        curl -u user@organization.com:$GLADLY_API_TOKEN \

        https://organization.gladly.com/api/v1/organization

        ```

        '
    basicAuth:
      type: http
      scheme: basic
      description: HTTP Basic auth — username is the API user email; password is the API token. Requires the "API User" permission.
x-tagGroups:
- name: REST API
  tags:
  - Agents
  - Public Answer
  - Answer Management
  - Audiences
  - Business Hours
  - Communications
  - Conversations
  - Customers
  - Events
  - Export
  - Freeform Topics
  - Inboxes
  - Organization
  - Proactive Conversations
  - Reports
  - Tasks
  - Teams
  - User Identity
  - Topics
  - Webhooks
- name: Webhooks
  tags:
  - Summary
  - Payloads
- name: Lookup API
  tags:
  - Customer Lookup
- name: Resources
  tags:
  - Versioning
  - Error Handling
  - Rate Limit
  - Rich Content
  - Launching Soon
