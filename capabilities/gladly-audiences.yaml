naftiko: 1.0.0-alpha2
info:
  label: Gladly REST API — Audiences
  description: Gladly REST API — Audiences. 1 operations. Self-contained Naftiko capability covering the Audiences business
    surface of the Gladly Customer Service Platform.
  tags:
  - Gladly
  - Audiences
  - Customer Service
  created: '2026-05-24'
  modified: '2026-05-24'
binds:
- namespace: env
  keys:
    GLADLY_ORGANIZATION: GLADLY_ORGANIZATION
    GLADLY_AGENT_EMAIL: GLADLY_AGENT_EMAIL
    GLADLY_API_TOKEN: GLADLY_API_TOKEN
capability:
  consumes:
  - type: http
    namespace: gladly-audiences
    baseUri: https://{{env.GLADLY_ORGANIZATION}}.gladly.com
    description: Gladly REST API — Audiences business capability.
    resources:
    - name: api-v1-audiences
      path: /api/v1/audiences
      operations:
      - name: getAudiences
        method: GET
        description: List Audiences
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters: []
    authentication:
      type: basic
      username: '{{env.GLADLY_AGENT_EMAIL}}'
      password: '{{env.GLADLY_API_TOKEN}}'
  exposes:
  - type: rest
    namespace: gladly-audiences-rest
    port: 8080
    description: REST adapter for Gladly Audiences.
    resources:
    - path: /v1/api/v1/audiences
      name: api-v1-audiences
      description: REST surface for api-v1-audiences.
      operations:
      - method: GET
        name: getAudiences
        description: List Audiences
        call: gladly-audiences.getAudiences
        with: {}
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: gladly-audiences-mcp
    port: 9090
    transport: http
    description: MCP adapter for Gladly Audiences.
    tools:
    - name: gladly-getAudiences
      description: List Audiences
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: gladly-audiences.getAudiences
      with: {}
      outputParameters:
      - type: object
        mapping: $.
