    description: Gladly REST API — Webhooks business capability.
    resources:
    - name: api-v1-webhooks
      path: /api/v1/webhooks
      operations:
      - name: createWebhook
        method: POST
        description: Create Webhook
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          required: true
          description: Request body (JSON).
      - name: getWebhooks
        method: GET
        description: List Webhooks
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters: []
    - name: api-v1-webhooks-webhookId
      path: /api/v1/webhooks/{webhookId}
      operations:
      - name: updateWebhook
        method: PATCH
        description: Update Webhook
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          required: true
          description: Request body (JSON).
      - name: deleteWebhook
        method: DELETE
        description: Delete Webhook
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters: []
      - name: getWebhook
        method: GET
        description: Get Webhook
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters: []
    authentication:
      type: basic
      username: '{{env.GLADLY_AGENT_EMAIL}}'
      password: '{{env.GLADLY_API_TOKEN}}'
  exposes:
  - type: rest
    namespace: gladly-webhooks-rest
    port: 8080
    description: REST adapter for Gladly Webhooks.
    resources:
    - path: /v1/api/v1/webhooks
      name: api-v1-webhooks
      description: REST surface for api-v1-webhooks.
      operations:
      - method: POST
        name: createWebhook
        description: Create Webhook
        call: gladly-webhooks.createWebhook
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/api/v1/webhooks
      name: api-v1-webhooks
      description: REST surface for api-v1-webhooks.
      operations:
      - method: GET
        name: getWebhooks
        description: List Webhooks
        call: gladly-webhooks.getWebhooks
        with: {}
        outputParameters:
