  - name: Features
    type: Features
    data:
      - name: Unified Customer Conversation
        description: >-
          One channel-agnostic conversation per customer across voice, chat, SMS, email, and social — with full history
          visible to agents and Sidekick AI.
      - name: Gladly Sidekick AI
        description: >-
          AI agent that resolves routine cases end-to-end, drafts agent replies, and hands off with full context.
          Configured in plain English via Guides.
      - name: Gladly Hero
        description: >-
          People-centric agent workspace (formerly Gladly Team) with customer timeline, topics, tasks, and inbox
          routing.
      - name: Answers Knowledge Base
        description: Versioned answers with audiences, topics, language scoping, and Help Center publication.
      - name: Lookup API Pattern
        description: >-
          Brand-hosted endpoint Gladly calls to enrich conversations with first-party customer data — no need to mirror
          profiles into Gladly.
      - name: App Platform
        description: Embedded apps inside Hero that surface third-party data (orders, loyalty, returns, CDP) next to the timeline.
      - name: Webhooks and Events
        description: Push delivery of conversation, message, task, customer, and agent-state events to brand endpoints.
      - name: Bulk Export Jobs
        description: Scheduled export jobs for agents, conversations, customers, and metrics in JSONL.
      - name: Multichannel Voice
        description: Native voice channel with call recording, Voice AI deflection, and toll-free / local number support.
      - name: Help Center Widget
        description: Embeddable, brand-styled self-service surface backed by Public Answers.
  - name: UseCases
    type: UseCases
    data:
      - name: Retail and DTC Customer Service
        description: >-
          Tie order data from Shopify or BigCommerce to every conversation so agents can refund, replace, or cancel
          orders without leaving Hero.
      - name: Travel and Hospitality Care
        description: >-
          Manage high-touch, multi-leg voice + messaging cases for airlines, cruise lines, and resorts (JetBlue,
          Breeze).
      - name: AI Deflection of Routine Cases
        description: >-
          Have Sidekick AI fully resolve order-status, return, password-reset, and FAQ traffic with seamless human
          handoff.
      - name: Loyalty-Aware Service
        description: >-
          Pull loyalty tier and lifetime value from Smile.io, Zinrelo, or LoyaltyLion to prioritize and personalize
          support.
      - name: Subscription Lifecycle Support
        description: >-
          Coordinate billing, pause/skip, and renewal questions with Recharge, Recurly, Ordergroove, or Skio
          in-conversation.
      - name: CDP-Driven Personalization
        description: Sync customer segments from Segment, HighTouch, or Fivetran into Gladly to tailor every interaction.
      - name: Proactive Outreach
        description: >-
          Trigger outbound conversations from order events, delivery delays, or abandoned carts via Proactive
          Conversations and Communications APIs.
  - name: Integrations
    type: Integrations
    data:
      - name: Shopify
        description: >-
          Native bidirectional integration — order history, customer LTV, refunds, cancellations, and discount codes
          from inside the conversation.
      - name: BigCommerce
        description: E-commerce platform integration for order and customer context.
      - name: Magento (Adobe Commerce)
        description: E-commerce platform integration.
      - name: Klaviyo
        description: Send conversation-created and closed events from Gladly to Klaviyo for segmentation and lifecycle email flows.
      - name: Recharge
        description: Subscription management integration for pause/skip/cancel inside conversations.
      - name: Recurly
