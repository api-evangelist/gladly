description: >-
  Gladly is a San Francisco–based people-centered customer service AI platform. The Gladly Hero agent workspace unifies
  voice, chat, SMS, email, and social into a single, channel-agnostic conversation per Customer, while Gladly Sidekick
  AI handles routine resolutions, drafts replies, and hands off to humans with full context. Brands integrate via the
  REST API, the Chat SDK (Web/iOS/Android), the Help Center widget, the embedded App Platform, webhooks, and a
  brand-hosted Lookup API. Customers include JetBlue, Allbirds, Crate & Barrel, Warby Parker, Ulta, Nordstrom, TUMI,
  UGG, Tory Burch, and Breeze Airways.
