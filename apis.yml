- aid: gladly:gladly-export-api
  name: Gladly Export API
  description: >-
    Export API is a simple, comprehensive, file-based data export. You can export the lifetime of your
    customers' conversations in Gladly to a central data repository such as your data warehouse or data
    lake. You can export all communications successfully delivered within a specified date range.  The
    export date range could be the past hour, the past 24 hours, or a custom data range. Please note,
    for one-time exports covering a period greater than six months, a service fee may apply.


    Job results can be deleted once downloaded.  Delete will remove all result files along with the job
    metadata.  Files older than 14 days are removed from Gladly and jobs older than 14 days are not available
    from the API.  If you discover that you need the deleted files later, please contact Gladly Support
    to regenerate them for you.


    ### SCHEDULING EXPORT JOBS


    You can schedule a one-time or repeating - hourly or daily - data export job.  By default, each organization
    has a daily export job configured.  To schedule a one-time job or change the job frequency, please
    contact Gladly Support.
