- aid: gladly:gladly-business-hours-api
  name: Gladly Business Hours API
  description: >-
    **Business Hours** define the operating schedule for your organization. They determine when your organization
    is available to handle customer communications and can be used to control routing, auto-responses,
    and other time-sensitive workflows.


    Business hours configurations include:

    - **Schedule blocks** for each day of the week specifying start and end times

    - **Timezone** in IANA format (e.g., America/Los_Angeles)

    - **Exceptions** for holidays or special dates


    One business hours configuration is marked as **primary** and serves as the default schedule for your
    organization. The primary business hours cannot be deleted.
