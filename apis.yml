    description: >-
      Gladly's unified REST API for the people-centered customer service platform. Exposes Customers, Conversations,
      Messages, Tasks, Answers (knowledge base), Topics, Teams, Inboxes, Audiences, Business Hours, Communications
      (outbound SMS/email), Webhooks, Events, Export jobs, Reports, Agents, Organization, Public Answers (Help Center),
      Proactive Conversations, and User Identity (JWT for authenticated chat). HTTP Basic auth with an agent email + API
      token. Default 10 req/sec per organization. Mounted at `https://{organization}.gladly.com/api/v1`.
  - aid: gladly:gladly-lookup-api
    name: Gladly Lookup API
    tags:
      - Customer Service
      - Customer Data
      - Webhooks
      - Integrations
    humanURL: https://developer.gladly.com/rest/
    properties:
      - url: https://developer.gladly.com/rest/
        type: Documentation
      - url: https://github.com/gladly/lookup-practice
        type: SampleSource
    description: >-
      Brand-hosted "Lookup" endpoint that Gladly calls outbound to enrich a conversation with first-party customer data.
      Lets brands keep system-of-record customer data in their own services while presenting a unified profile inside
      the Gladly Hero agent workspace and to Sidekick AI.
  - aid: gladly:gladly-chat-sdk
    name: Gladly Chat SDK
    tags:
      - Customer Service
      - Chat
      - SDK
      - Web
    humanURL: https://developer.gladly.com/chat/
    properties:
      - url: https://developer.gladly.com/chat/
        type: Documentation
      - url: https://cdn.gladly.com/chat-sdk/widget.js
        type: SDK
    description: >-
      JavaScript chat widget loaded from the Gladly CDN. Exposes `Gladly.init`, `show`, `close`, `setUser`,
      `startConversation`, `navigate`, `applyCampaign`, `getAvailability`, plus a full event system (availability,
      conversation lifecycle, messages, campaigns). Supports JWT-authenticated user identity issued by the User Identity
      REST endpoint.
  - aid: gladly:gladly-sidekick-ios-sdk
    name: Gladly Sidekick iOS SDK
    tags:
      - Customer Service
      - Chat
      - SDK
      - iOS
      - Mobile
    humanURL: https://developer.gladly.com/ios-sdk/
    properties:
      - url: https://developer.gladly.com/ios-sdk/
        type: Documentation
      - url: https://github.com/gladly/sidekick-ios-sdk
        type: SourceCode
      - url: https://github.com/gladly/sidekick-ios-sdk
        type: SDK
    description: >-
      Swift SDK (v1.2.5, iOS 11+) for embedding the Gladly Sidekick chat experience in iOS apps. Ships `Gladly`,
      `GladlySettings`, `GladlyUser`, `UIConfiguration`, `UIHeaderConfiguration`, and delegate protocols for chat
      display, notifications, and unread counts.
  - aid: gladly:gladly-sidekick-android-sdk
    name: Gladly Sidekick Android SDK
    tags:
      - Customer Service
      - Chat
      - SDK
      - Android
      - Mobile
    humanURL: https://developer.gladly.com/android-sdk/
    properties:
      - url: https://developer.gladly.com/android-sdk/
        type: Documentation
      - url: https://github.com/gladly/sidekick-android-sdk
        type: SourceCode
      - url: https://github.com/gladly/sidekick-android-sdk
        type: SDK
    description: >-
      Kotlin SDK (Android Q / API 29+) for embedding the Gladly Sidekick chat experience in Android apps. Provides
      `Gladly.initialize`, `setUser`, `showChat`, `handleMessageReceived`, `getUnreadCount`,
      `registerPushToken`/`unregisterPushToken` plus EventInterface for events and errors.
  - aid: gladly:gladly-help-center
    name: Gladly Help Center
    tags:
      - Customer Service
      - Help Center
      - Self-Service
      - Web
    humanURL: https://developer.gladly.com/help-center/
    properties:
      - url: https://developer.gladly.com/help-center/
        type: Documentation
    description: >-
      Embeddable Help Center widget that builds an FAQ/help page on a brand's website powered by Public Answers from
      Gladly's Answers knowledge base. Exposes a `.gladlyHC` CSS class hierarchy for fully custom styling. SPA support
      is limited (Next.js not supported); best run from a single non-SPA HTML page.
  - aid: gladly:gladly-app-platform
    name: Gladly App Platform
    tags:
      - Customer Service
      - Apps
      - Integrations
      - Embedded
    humanURL: https://help.gladly.com/developer-tutorials/docs
    properties:
      - url: https://help.gladly.com/developer-tutorials/docs
        type: Documentation
      - url: https://github.com/gladly/app-platform-examples
        type: SampleSource
      - url: https://github.com/gladly/app-platform-appcfg-cli
        type: CLI
      - url: https://github.com/gladly/gladly-getting-started
        type: SampleSource
      - url: https://github.com/gladly/gladapp-examples
        type: SampleSource
    description: >-
      Framework for building embedded "Apps" inside the Gladly Hero agent workspace. Apps surface third-party data
      (orders, loyalty, returns, CDP profiles) alongside the customer timeline. Authored as JavaScript/Groovy bundles
      and managed via the `app-platform-appcfg-cli`.
  - aid: gladly:gladly-webhooks
    name: Gladly Webhooks
    tags:
      - Customer Service
      - Webhooks
      - Events
    humanURL: https://developer.gladly.com/rest/
    properties:
      - url: https://developer.gladly.com/rest/
        type: Documentation
      - url: https://github.com/gladly/webhook-examples
        type: SampleSource
      - url: json-schema/gladly-webhook-schema.json
        type: JSONSchema
      - url: examples/gladly-webhook-create-example.json
        type: Example
    description: >-
      Event-driven push channel that delivers Gladly platform events (conversation created/updated/closed, message
      created, task created/updated/closed, customer created/updated, agent state changes) to a brand-supplied HTTPS
      endpoint. Managed through the Webhooks REST endpoints. Includes retry policy and logging.
